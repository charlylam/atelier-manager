# Pipeline CI du backend Atelier Manager.
# Démarre l'environnement Docker de test, réinitialise la base de test,
# vérifie le code avec ESLint et TypeScript, puis lance les tests du backend.

name: Backend CI

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

jobs:
  backend-test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: atelier
      DATABASE_URL: postgresql://atelier:testpassword@db:5432/atelier

      POSTGRES_TEST_USER: atelier
      POSTGRES_TEST_PASSWORD: testpassword
      POSTGRES_TEST_DB: atelier_test
      TEST_DATABASE_URL: postgresql://atelier:testpassword@db-test:5432/atelier_test

      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: ci_test_secret
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start Docker services
        run: docker compose -f docker-compose.dev.yml up -d --build backend-test db-test

      - name: Reset test database
        run: docker compose -f docker-compose.dev.yml exec -T backend-test npx prisma migrate reset --force

      - name: Seed test database
        run: docker compose -f docker-compose.dev.yml exec -T backend-test npm run db:seed

      - name: Run backend lint
        run: docker compose -f docker-compose.dev.yml exec -T backend-test npm run lint

      - name: Run backend typecheck
        run: docker compose -f docker-compose.dev.yml exec -T backend-test npm run typecheck

      - name: Run backend tests
        run: docker compose -f docker-compose.dev.yml exec -T backend-test npm test
