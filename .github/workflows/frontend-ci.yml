# Pipeline CI du frontend Atelier Manager.
# Installe les dépendances, vérifie le code avec ESLint et TypeScript,
# puis lance les tests du frontend.

name: Frontend CI

on:
  push:
    branches:
      - DEV
  pull_request:
    branches:
      - DEV

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test
