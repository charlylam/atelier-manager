services:
  db:
    image: postgres:17-alpine
    container_name: atelier-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5440:5432'
    volumes:
      - atelier-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17-alpine
    container_name: atelier-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    ports:
      - '5441:5432'
    volumes:
      - atelier-test-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_TEST_USER} -d ${POSTGRES_TEST_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: atelier-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: '${DATABASE_URL}?schema=public'
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - '4000:4000'
      - '5565:5555'
    volumes:
      - ./backend:/app
      - /app/node_modules

  backend-test:
    build:
      context: ./backend
      target: dev
    container_name: atelier-backend-test
    restart: unless-stopped
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DATABASE_URL: '${TEST_DATABASE_URL}'
      PORT: 4001
      AUTH_RATE_LIMIT_MAX: 1000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - '4001:4001'
      - '5566:5556'
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  atelier-data:
  atelier-test-data:
